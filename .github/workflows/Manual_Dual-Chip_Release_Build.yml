name: Manual Dual-Chip Release Build

on:
  workflow_dispatch: # Allows manual triggering from the GitHub Actions UI

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: 'recursive' # Required for project-specific submodules/drivers

    # 1. AUTOMATION: Create a release branch/tag from version.txt — the same
    #    file ESP-IDF's build reads for PROJECT_VER (see tools/cmake/project.cmake:
    #    version.txt beats git describe), so the release name always matches
    #    what's actually embedded in the built firmware's esp_app_desc. Edit
    #    version.txt by hand to set the release version; there is no manual
    #    input for it anymore, to avoid the two ever disagreeing.
    - name: Create Release Branch & Tag
      id: create_version
      run: |
        RAW_VERSION="$(tr -d '[:space:]' < version.txt)"
        VERSION="v${RAW_VERSION}"
        echo "version=$VERSION" >> $GITHUB_OUTPUT

        # Create and push a local branch to freeze the build state
        git checkout -b "release/$VERSION"
        git push origin "release/$VERSION"

    # 2. AUTOMATION: Build ESP32-P4 firmware applying project sdkconfig defaults
    - name: Build ESP32-P4 Firmware
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v6.1  # without tailing .0
        target: esp32p4
        path: '.'
        # Generates the configuration exactly matching the project sdkconfig for the Waveshare display
        command: |
          idf.py defconfig
          idf.py build

    # Prepare the compiled App binary for upload
    - name: Prepare P4 Binary
      run: cp build/weather_display.bin firmware_p4.bin

    # 3. AUTOMATION: Build the ESP32-C6 "hosted slave" (coprocessor) firmware
    #    from Espressif's esp_hosted source. There is no prebuilt binary to
    #    download here — verified that espressif/esp-hosted-mcu publishes no
    #    GitHub Releases and carries no .bin files anywhere in the repo, so
    #    building it ourselves is the only way to produce one. Uses
    #    esp_hosted's own examples/network_split/station/cp project as the
    #    coprocessor firmware.
    #
    #    Which tag to build is resolved from THIS repo's own
    #    main/idf_component.yml (the "3.0.*"-style constraint the P4 build
    #    itself is pinned to) rather than always taking esp-hosted-mcu's
    #    default branch — the P4 and C6 must agree on an esp_hosted major.minor
    #    or eh_host_mcu_transport_verify_fw_compat() logs a version-mismatch
    #    error at boot (main/main.c's on-device logs already show this for
    #    the currently-flashed C6). Only the simple "MAJOR.MINOR.*" glob this
    #    project actually uses is handled — not full semver-range syntax.
    - name: Resolve C6 esp_hosted Version
      id: c6_ref
      run: |
        CONSTRAINT=$(awk '
          /espressif\/esp_hosted:/ { found=1; next }
          found && /version:/ {
            gsub(/.*version:[[:space:]]*"?/, "");
            gsub(/".*/, "");
            print;
            exit
          }' main/idf_component.yml)
        if [ -z "$CONSTRAINT" ]; then
          echo "::error::Could not find espressif/esp_hosted's version constraint in main/idf_component.yml"
          exit 1
        fi
        case "$CONSTRAINT" in
          *.\*)
            PREFIX="v${CONSTRAINT%.*}."
            ;;
          *)
            echo "::error::Unsupported esp_hosted version constraint '$CONSTRAINT' — only MAJOR.MINOR.* globs are handled, update this step for other syntax"
            exit 1
            ;;
        esac

        LATEST=$(git ls-remote --tags --refs https://github.com/espressif/esp-hosted-mcu.git "refs/tags/${PREFIX}*" \
          | awk -F'/' '{print $NF}' | sort -V | tail -n1)
        if [ -z "$LATEST" ]; then
          echo "::error::No espressif/esp-hosted-mcu tag matches '${PREFIX}*' (constraint '$CONSTRAINT' from main/idf_component.yml)"
          exit 1
        fi

        echo "Building esp-hosted-mcu $LATEST (matches main/idf_component.yml constraint '$CONSTRAINT')"
        echo "ref=$LATEST" >> $GITHUB_OUTPUT

    # FIX (first real run failed here): the checkout path doubles as the
    # espressif/esp_hosted component the cp project's main/CMakeLists.txt
    # requires — ESP-IDF's CMake build system derives a component's name
    # from its directory name, not its idf_component.yml, so this checkout
    # must be named "esp_hosted" (or "espressif__esp_hosted"). An earlier
    # path name here ("esp-hosted-mcu-src") produced exactly this failure:
    # "Failed to resolve component 'esp_hosted' required by component
    # 'main': unknown name" — see the CMake warning that precedes it in a
    # failed run's log for the exact same explanation.
    - name: Checkout esp-hosted-mcu (for the C6 coprocessor firmware)
      uses: actions/checkout@v4
      with:
        repository: espressif/esp-hosted-mcu
        ref: ${{ steps.c6_ref.outputs.ref }}
        path: esp_hosted

    - name: Build ESP32-C6 Hosted Slave Firmware
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v6.1
        target: esp32c6
        path: 'esp_hosted/examples/network_split/station/cp'
        command: |
          idf.py build

    # Prepare the compiled C6 binary and read its version straight out of
    # the source that just built it (eh_common_fw_version.h — a committed,
    # generated file, per its own "DO NOT MODIFY" header, from esp_hosted's
    # tools/check_fw_versions.py, populated from that same checkout's own
    # idf_component.yml), rather than a hardcoded/guessed string.
    #
    # NOTE: this searches the whole "esp_hosted" checkout, not a
    # managed_components/ subfolder under the cp project — the checkout path
    # rename above (to satisfy the cp project's component-name resolution)
    # means the component manager reuses that checkout directly instead of
    # copying it into cp's own managed_components/, per the build log's own
    # "NOTICE: Using component placed at ... for dependency
    # 'espressif/esp_hosted'" line.
    - name: Prepare C6 Binary and Read Its Version
      id: c6_version
      run: |
        CP_DIR="esp_hosted/examples/network_split/station/cp"
        cp "$CP_DIR/build/eh_cp_network_split_station.bin" esp32c6_hosted_slave.bin

        VER_HDR=$(find "esp_hosted" \
          -name "eh_common_fw_version.h" -print -quit)
        MAJ=$(grep -oP '#define\s+PROJECT_VERSION_MAJOR_1\s+\K\d+' "$VER_HDR")
        MIN=$(grep -oP '#define\s+PROJECT_VERSION_MINOR_1\s+\K\d+' "$VER_HDR")
        PAT=$(grep -oP '#define\s+PROJECT_VERSION_PATCH_1\s+\K\d+' "$VER_HDR")
        echo "c6_version=${MAJ}.${MIN}.${PAT}" >> $GITHUB_OUTPUT

    # 4. AUTOMATION: Calculate SHA-256 checksums and write the manifest.json
    - name: Generate Manifest and Checksums
      id: manifest
      run: |
        VERSION="${{ steps.create_version.outputs.version }}"
        C6_VERSION="${{ steps.c6_version.outputs.c6_version }}"

        P4_SHA=$(sha256sum firmware_p4.bin | awk '{print $1}')
        C6_SHA=$(sha256sum esp32c6_hosted_slave.bin | awk '{print $1}')

        cat <<EOF > manifest.json
        {
          "version": "$VERSION",
          "p4_sha256": "$P4_SHA",
          "c6_version": "$C6_VERSION",
          "c6_sha256": "$C6_SHA"
        }
        EOF

        echo "Manifest generated successfully:"
        cat manifest.json

    # 5. AUTOMATION: Create and publish the GitHub Release with attached assets
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.create_version.outputs.version }}
        target_commitish: release/${{ steps.create_version.outputs.version }}
        name: Release ${{ steps.create_version.outputs.version }}
        body: |
          Manually triggered release build for Weather Display (Waveshare P4 Board).
          - ESP-IDF Version: v6.1.0
          - Includes display drivers and esp-hosted SPI network configuration.
        draft: false
        prerelease: false
        files: |
          firmware_p4.bin
          esp32c6_hosted_slave.bin
          manifest.json
